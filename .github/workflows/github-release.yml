name: Create GitHub Release

on:
  push:
    tags:
      - "v*"  # Trigger when a version tag is pushed (e.g., v1.0.0)

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # The release notes are the version's section of the changelog. If it
      # has none, fall back to GitHub's generated notes rather than publish
      # an empty release.
      - name: Extract the release notes from the changelog
        id: notes
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^# / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No changelog section for $GITHUB_REF_NAME, using generated notes instead."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: parseclj ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          bodyFile: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generateReleaseNotes: ${{ steps.notes.outputs.found != 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
