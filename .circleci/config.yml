version: 2.1

orbs:
  win: circleci/windows@2.2.0

# Default actions to perform on each Emacs version
commands:
  setup:
    steps:
      - checkout
      - run:
          name: Install Eldev
          command: curl -fsSL https://raw.githubusercontent.com/emacs-eldev/eldev/master/webinstall/circle-eldev > x.sh && source ./x.sh

  macos-setup:
    steps:
      - checkout
      - run:
          name: Install Emacs latest
          command: |
            brew update
            brew install emacs
      - run:
          name: Install Eldev
          command: curl -fsSL https://raw.githubusercontent.com/emacs-eldev/eldev/master/webinstall/circle-eldev > x.sh && source ./x.sh

  setup-windows:
    steps:
      - checkout
      - run:
          name: Install Eldev
          command: |
            # Remove expired DST Root CA X3 certificate. Workaround
            # for https://debbugs.gnu.org/cgi/bugreport.cgi?bug=51038
            # bug on Emacs 27.2.
            gci cert:\LocalMachine\Root\DAC9024F54D8F6DF94935FB1732638CA6AD77C13
            gci cert:\LocalMachine\Root\DAC9024F54D8F6DF94935FB1732638CA6AD77C13 | Remove-Item
            (iwr https://raw.githubusercontent.com/emacs-eldev/eldev/master/webinstall/circle-eldev.ps1).Content | powershell -command -
  test:
    steps:
      - run:
          name: Run regression tests
          command: eldev -dtT -p test
  lint:
    steps:
      - run:
          name: Run Elisp-lint
          command: eldev lint
      - run:
          name: Byte-compile .el files
          command: eldev -dtT compile --warnings-as-errors

jobs:
  test-ubuntu:
    parameters:
      emacs-version:
        type: string
    docker:
      - image: silex/emacs:<< parameters.emacs-version >>-ci
        entrypoint: bash
    steps:
      - setup
      - test

  test-macos-emacs-latest:
    macos:
      xcode: "26.3.0"
    resource_class: m4pro.medium
    steps:
      - macos-setup
      - test

  test-windows-emacs-latest:
    executor: win/default
    steps:
      - run:
          name: Install Emacs latest
          command: |
            choco install emacs
      - setup-windows
      - test

  test-lint:
    docker:
      - image: silex/emacs:28-ci
    steps:
      - setup
      - lint

workflows:
  ci-test-matrix:
    jobs:
      - test-lint
      - test-ubuntu:
          name: test-ubuntu-emacs-<< matrix.emacs-version >>
          matrix:
            parameters:
              emacs-version: ["26", "27", "28", "29", "master"]
      - test-windows-emacs-latest
      - test-macos-emacs-latest
